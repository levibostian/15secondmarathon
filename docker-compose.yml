version: '3.8'

services:
  update-data:
    build: .
    image: 15secondmarathon-updater:latest
    volumes:
      - .:/repo
    # Environment variables should be passed via command line
    # Example: docker-compose run --rm -e YOUTUBE_API_KEY="..." -e GITHUB_TOKEN="..." update-data
    environment:
      - YOUTUBE_API_KEY
      - GITHUB_TOKEN
      - GIT_EMAIL
      - GIT_NAME
